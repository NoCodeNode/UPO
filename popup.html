<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>UPO</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #1f2937;
    }
    p {
      margin: 0 0 15px 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .status.configured {
      background: #d1fae5;
      color: #065f46;
    }
    .status.not-configured {
      background: #fee2e2;
      color: #991b1b;
    }
    .shortcut {
      background: #f3f4f6;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #374151;
      margin-top: 15px;
    }
    code {
      background: #1f2937;
      color: #10b981;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h2>⚡ UPO</h2>
  
  <div id="statusDiv"></div>
  
  <p>Universal Prompt Optimizer powered by Cerebras AI</p>
  
  <button id="optionsBtn">⚙️ Open Settings</button>
  
  <div class="shortcut">
    <strong>Quick Start:</strong><br>
    1. Select text<br>
    2. Press <code>Ctrl+Q</code><br>
    3. Text optimized!
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
